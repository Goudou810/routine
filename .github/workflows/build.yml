name: Construire l'APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ecrire le projet
        run: |
          mkdir -p app/src/main/java/com/routine/app app/src/main/assets
          cat > settings.gradle <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'Routine'
          include ':app'
          EOF_0
          cat > app/build.gradle <<'EOF_1'
          plugins { id 'com.android.application' version '8.5.2' }

          android {
              namespace 'com.routine.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.routine.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF_1
          cat > app/src/main/AndroidManifest.xml <<'EOF_2'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32"/>
              <application
                  android:label="Ma routine"
                  android:icon="@android:drawable/ic_lock_idle_alarm"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <receiver android:name=".Sched$Alarm" android:exported="false"/>
                  <receiver android:name=".Sched$Boot" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF_2
          cat > app/src/main/java/com/routine/app/MainActivity.java <<'EOF_3'
          package com.routine.app;

          import android.app.Activity;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              WebView w;

              public class Bridge {
                  @JavascriptInterface
                  public void save(String json) {
                      Sched.store(MainActivity.this, json);
                      Sched.all(MainActivity.this);
                  }
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }
                  w = new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.getSettings().setDomStorageEnabled(true);
                  w.addJavascriptInterface(new Bridge(), "Android");
                  setContentView(w);
                  w.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  finish();
              }
          }
          EOF_3
          cat > app/src/main/java/com/routine/app/Sched.java <<'EOF_4'
          package com.routine.app;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import java.util.Calendar;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class Sched {
              static SharedPreferences p(Context c) {
                  return c.getSharedPreferences("r", 0);
              }

              static void store(Context c, String json) {
                  p(c).edit().putString("d", json).apply();
              }

              static PendingIntent pi(Context c, int i, String s, String e, String t) {
                  Intent it = new Intent(c, Alarm.class);
                  it.putExtra("i", i);
                  it.putExtra("s", s);
                  it.putExtra("e", e);
                  it.putExtra("t", t);
                  return PendingIntent.getBroadcast(c, i, it,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static void set(Context c, int i, String s, String e, String t) {
                  String[] h = s.split(":");
                  Calendar cal = Calendar.getInstance();
                  cal.set(Calendar.HOUR_OF_DAY, Integer.parseInt(h[0]));
                  cal.set(Calendar.MINUTE, Integer.parseInt(h[1]));
                  cal.set(Calendar.SECOND, 0);
                  cal.set(Calendar.MILLISECOND, 0);
                  if (cal.getTimeInMillis() <= System.currentTimeMillis() + 1000) {
                      cal.add(Calendar.DAY_OF_YEAR, 1);
                  }
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  PendingIntent pend = pi(c, i, s, e, t);
                  try {
                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.getTimeInMillis(), pend);
                  } catch (SecurityException x) {
                      am.set(AlarmManager.RTC_WAKEUP, cal.getTimeInMillis(), pend);
                  }
              }

              static void all(Context c) {
                  try {
                      AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                      int old = p(c).getInt("n", 0);
                      for (int i = 0; i < old; i++) {
                          am.cancel(pi(c, i, "", "", ""));
                      }
                      JSONArray a = new JSONArray(p(c).getString("d", "[]"));
                      for (int i = 0; i < a.length(); i++) {
                          JSONObject o = a.getJSONObject(i);
                          if (o.optBoolean("n", true)) {
                              set(c, i, o.getString("s"), o.getString("e"), o.getString("t"));
                          }
                      }
                      p(c).edit().putInt("n", a.length()).apply();
                  } catch (Exception x) {
                  }
              }

              public static class Alarm extends BroadcastReceiver {
                  @Override
                  public void onReceive(Context c, Intent in) {
                      int i = in.getIntExtra("i", 0);
                      String s = in.getStringExtra("s");
                      String e = in.getStringExtra("e");
                      String t = in.getStringExtra("t");
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      nm.createNotificationChannel(new NotificationChannel("r", "Routine", NotificationManager.IMPORTANCE_HIGH));
                      PendingIntent open = PendingIntent.getActivity(c, 0,
                              new Intent(c, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                      Notification n = new Notification.Builder(c, "r")
                              .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                              .setContentTitle(t)
                              .setContentText(s + " - " + e)
                              .setContentIntent(open)
                              .setAutoCancel(true)
                              .build();
                      nm.notify(i, n);
                      set(c, i, s, e, t);
                  }
              }

              public static class Boot extends BroadcastReceiver {
                  @Override
                  public void onReceive(Context c, Intent in) {
                      all(c);
                  }
              }
          }
          EOF_4
          cat > app/src/main/assets/index.html <<'EOF_5'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Ma routine</title>
          <style>
          :root{--bg:#eef2f5;--sf:#fff;--ink:#12212f;--mu:#5d6d7c;--ln:#d5dde4;--act:#1f6f8b;--trd:#6d4fc2;--pau:#8a97a3}
          @media (prefers-color-scheme:dark){:root{--bg:#0f1a24;--sf:#172635;--ink:#e6edf3;--mu:#93a4b3;--ln:#27394a;--act:#5bb6d4;--trd:#a78bfa;--pau:#6e7f8e;color-scheme:dark}}
          body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif}
          main{max-width:520px;margin:0 auto;padding:18px 14px 28px}
          h1{font-size:26px;line-height:1.15;margin:0 0 4px}
          .sub{margin:0 0 14px;color:var(--mu);font-size:14px}
          #now{padding:10px 12px;margin-bottom:14px;border-left:4px solid var(--act);background:var(--sf);font-size:15px}
          .row{display:grid;grid-template-columns:88px 1fr;gap:10px;margin-bottom:6px}
          .tm{display:flex;flex-direction:column;gap:2px}
          input{font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 4px;min-width:0}
          input[type=time]{width:88px;font-size:15px}
          .tm input:first-child{font-weight:700}
          .tm input:last-child{color:var(--mu)}
          .bl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 6px;padding:8px 6px 8px 12px;border-left:4px solid var(--c);border-radius:0 6px 6px 0;background:var(--sf);background:color-mix(in srgb,var(--c) 11%,var(--sf))}
          .bl.now{box-shadow:0 0 0 2px var(--c)}
          .t{width:100%;font-weight:600}
          .d{grid-column:1;display:flex;gap:12px;align-items:center;color:var(--mu);font-size:13px;padding-left:4px}
          .d input{margin:0}
          .x{grid-row:1/3;grid-column:2;border:0;background:none;color:var(--mu);font-size:22px;padding:6px 10px}
          .bar{display:flex;gap:8px;margin-top:16px}
          .b{flex:1;font:inherit;padding:11px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);color:var(--ink)}
          .note{margin-top:12px;color:var(--mu);font-size:13px}
          </style>
          </head>
          <body>
          <main>
          <h1>Ma routine</h1>
          <p class="sub" id="sub"></p>
          <div id="now"></div>
          <div id="list"></div>
          <div class="bar"><button class="b" id="add">Ajouter un bloc</button><button class="b" id="rst">Réinitialiser</button></div>
          <p class="note">Touche une heure ou un titre pour le modifier. Commence un titre par « Pause » pour le griser. Décoche « Notification » pour couper le rappel d'un bloc.</p>
          </main>
          <script>
          const KEY="routine-v1";
          const DEF=[["06:00","06:30","Réveil"],["06:30","07:15","Anglais"],["07:15","07:45","Pause petit-déjeuner"],["07:45","08:45","Lecture"],["08:45","09:00","Pause"],["09:00","09:45","Anglais (écoute et pratique)"],["09:45","10:00","Pause"],["10:00","12:00","Trading"],["12:00","13:00","Pause déjeuner"],["13:00","14:30","Jeu vidéo"],["14:30","14:45","Pause"],["14:45","16:15","Série ou film"],["16:15","16:30","Pause"],["16:30","17:30","Lecture"],["17:30","18:30","Pause dîner"],["18:30","19:30","Série ou film"],["19:30","19:45","Pause"],["19:45","20:30","Lecture au calme"],["20:30","21:00","Bilan OODA"]];
          const $=id=>document.getElementById(id);
          const mn=t=>{const p=(t||"").split(":");return(+p[0]||0)*60+(+p[1]||0)};
          const hm=n=>String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
          const fmt=d=>d<=0?"fin avant le début":d<60?d+" min":Math.floor(d/60)+" h"+(d%60?" "+d%60:"");
          const col=t=>{t=(t||"").toLowerCase();return t.startsWith("pause")?"var(--pau)":t.includes("trading")?"var(--trd)":"var(--act)"};
          const fresh=()=>DEF.map(([s,e,t])=>({s,e,t,n:true}));
          function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(d)&&d.length)return d}catch(e){}return fresh()}
          function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}try{if(window.Android)Android.save(JSON.stringify(data))}catch(e){}}
          function mk(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e}
          function inp(type,v,label){const e=mk("input");e.type=type;e.value=v||"";e.setAttribute("aria-label",label);return e}
          let data=load(),rows=[];
          function render(){
           data.sort((a,b)=>mn(a.s)-mn(b.s));
           const L=$("list");L.innerHTML="";rows=[];
           data.forEach((x,i)=>{
            const r=mk("div","row"),tm=mk("div","tm");
            const a=inp("time",x.s,"Début"),b=inp("time",x.e,"Fin");
            tm.append(a,b);
            const bl=mk("div","bl");bl.style.setProperty("--c",col(x.t));
            const t=inp("text",x.t,"Titre");t.className="t";
            const d=mk("div","d"),sp=mk("span");sp.textContent=fmt(mn(x.e)-mn(x.s));
            const lb=mk("label"),cb=inp("checkbox","","Notification");cb.checked=x.n!==false;
            cb.onchange=()=>{x.n=cb.checked;save()};
            lb.append(cb," Notification");d.append(sp,lb);
            const del=mk("button","x");del.textContent="×";del.setAttribute("aria-label","Supprimer ce bloc");
            a.onchange=()=>{x.s=a.value||x.s;commit()};
            b.onchange=()=>{x.e=b.value||x.e;commit()};
            t.onchange=()=>{x.t=t.value;commit()};
            del.onclick=()=>{data.splice(i,1);commit()};
            bl.append(t,del,d);r.append(tm,bl);L.append(r);rows.push(bl);
           });
           $("sub").textContent=data.length?"Lever à "+data[0].s+", coucher à "+data[data.length-1].e:"Aucun bloc pour l'instant";
           tick();
          }
          function commit(){save();render()}
          function tick(){
           const n=new Date(),c=n.getHours()*60+n.getMinutes();let k=-1;
           data.forEach((x,i)=>{const on=mn(x.s)<=c&&c<mn(x.e);if(on&&k<0)k=i;if(rows[i])rows[i].classList.toggle("now",on&&k===i)});
           $("now").textContent=k>=0?"Maintenant : "+data[k].t+", jusqu'à "+data[k].e:"Aucun bloc en cours";
          }
          $("add").onclick=()=>{const s=Math.min(data.length?mn(data[data.length-1].e):720,1409);data.push({s:hm(s),e:hm(s+30),t:"Nouvelle activité",n:true});commit()};
          let armed=0;
          $("rst").onclick=()=>{const b=$("rst");if(!armed){armed=1;b.textContent="Confirmer la réinitialisation";setTimeout(()=>{armed=0;b.textContent="Réinitialiser"},3000)}else{armed=0;b.textContent="Réinitialiser";data=fresh();commit()}};
          render();save();setInterval(tick,30000);
          </script>
          </body>
          </html>
          EOF_5
      - name: Compiler
        run: gradle assembleDebug --no-daemon
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk routine.apk
          gh release delete apk -y --cleanup-tag || true
          gh release create apk routine.apk --title "Ma routine" --notes "APK de Ma routine"
